<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoJo HFTF Arcade</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }
        #player {
            width: 100vw; height: 100vh;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <!-- Loads a core emulator engine bundle built natively for GitHub Pages -->
    <script src="https://jsdelivr.net"></script>
    <script>
        new NeptunJS({
            element: document.getElementById('player'),
            core: 'fbalpha2012_cps3', // Runs the Capcom Play System 3 engine architecture natively
            
            // This reads your 15MB game clone archive directly out of your repository 
            rom: 'jojobanr1.zip', 
            
            // Your exact parent ROM Google Drive ID configured with a forced raw data call
            bios: 'https://google.com'
        });
    </script>

</body>
</html>
