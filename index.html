<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFTF Arcade</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script>
        EJS_player = '#game';
        EJS_core = 'arcade';
        EJS_startOnLoaded = true; // Forces the emulator to start the second files download
        
        // This targets your 15MB file uploaded directly onto GitHub
        EJS_gameUrl = 'jojobanr1.zip';
        
        // Google Drive raw download link with auto-bypass parameter included
        EJS_biosUrl = 'https://drive.google.com/uc?export=download&id=1Yf02_XW-Vnf_Jiq_qdGsFRwQ2I8g44u2';
        
        // Swapped to an alternative high-availability storage delivery network
        EJS_pathtodata = 'https://githack.com';
    </script>
    
    <script src="https://githack.comloader.js"></script>

</body>
</html>
